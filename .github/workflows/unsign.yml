name: Build IPA
on:
  workflow_dispatch:

jobs:
  unsign:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Archive (skip signing)
        run: |
          mkdir -p build
          xcodebuild -project PELite.xcodeproj -scheme PELite \
            -configuration Release -sdk iphoneos \
            -archivePath build/PELite.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            archive
      - name: Pack unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PELite.xcarchive/Products/Applications/PELite.app build/Payload/
          cd build && zip -qry PELite-unsigned.ipa Payload && ls -lh PELite-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PELite-unsigned
          path: build/PELite-unsigned.ipa
